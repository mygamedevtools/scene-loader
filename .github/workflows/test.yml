name: 🧪 Tests
on:
  # Keep these two lists in sync. GitHub Actions does not support YAML anchors.
  push:
    branches:
      - main
    paths:
      # The Unity project: the package under test, the manifests that resolve its
      # dependencies, the vendored packages it compiles alongside, the Addressables
      # setup the tests run against, and the editor version the project opens with.
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      # The workflows that decide what gets tested and how.
      - '.github/workflows/test.yml'
      - '.github/workflows/detect-unity-versions.yml'
      # The allocation report's comparison script.
      - 'Tools/**'
      # Docs never change behaviour, including docs shipped inside a package.
      - '!**.md'
  pull_request:
    branches:
      - main
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/test.yml'
      - '.github/workflows/detect-unity-versions.yml'
      - 'Tools/**'
      - '!**.md'
  schedule:
    # Run on the 1st of every month at 2 AM UTC
    - cron: '0 2 1 * *'
  workflow_dispatch:

jobs:
  detect-versions:
    name: Detect Unity Versions
    uses: ./.github/workflows/detect-unity-versions.yml

  test:
    name: Unity ${{ matrix.unityVersion }} - playmode
    runs-on: ubuntu-latest
    needs: detect-versions
    permissions:
      contents: read
      checks: write
      # The allocation report is posted as a PR comment on the newest leg only.
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        unityVersion: ${{ fromJSON(needs.detect-versions.outputs.versions) }}
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Check for code changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            code:
              - '**.cs'

      - uses: actions/cache@v5
        with:
          path: Library
          key: Library-${{ matrix.unityVersion }}-playmode
          restore-keys: |
            Library-${{ matrix.unityVersion }}-

      - name: Use Unity 6.0 compatible packages
        if: startsWith(matrix.unityVersion, '6000.0')
        run: cp Packages/manifest.6.0.json Packages/manifest.json

      - name: Use Unity 6.3 compatible packages
        if: startsWith(matrix.unityVersion, '6000.3')
        run: cp Packages/manifest.6.3.json Packages/manifest.json

      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ./
          unityVersion: ${{ matrix.unityVersion }}
          testMode: playmode
          artifactsPath: playmode-artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity ${{ matrix.unityVersion }} playmode Test Results
          coverageOptions: 'generateAdditionalMetrics;assemblyFilters:+MyGameDevTools.SceneLoading'

      - name: Find existing allocation comment
        id: find-comment
        if: github.event_name == 'pull_request' && matrix.unityVersion == needs.detect-versions.outputs.latest
        uses: peter-evans/find-comment@v3
        continue-on-error: true
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '## Allocation report'

      # The baseline lives as a release asset rather than a file in the repo, so nothing
      # here needs write access and there is no refresh commit on main. Walks back through
      # recent releases because a release only gets the asset once its publish workflow has
      # run, and the newest one may not have it yet.
      - name: Fetch the baseline from the latest release
        id: baseline
        if: matrix.unityVersion == needs.detect-versions.outputs.latest
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for TAG in $(gh release list --repo ${{ github.repository }} --limit 10 \
                        --json tagName -q '.[].tagName'); do
            if gh release download "$TAG" --repo ${{ github.repository }} \
                 --pattern allocation-report.json --output allocation-baseline.json 2>/dev/null; then
              echo "baseline-tag=$TAG" >> $GITHUB_OUTPUT
              echo "Baseline taken from $TAG"
              exit 0
            fi
          done
          echo "::notice::No release carries an allocation report yet; every case will read as new."

      # Informational only, and only on the newest leg: one threshold across three editor
      # versions and three Addressables majors would be either useless or constantly wrong.
      - name: Compare allocations
        id: allocations
        if: matrix.unityVersion == needs.detect-versions.outputs.latest && hashFiles('allocation-report.json') != ''
        run: |
          python3 Tools/compare_allocations.py \
            --baseline allocation-baseline.json \
            --baseline-label "${{ steps.baseline.outputs.baseline-tag }}" \
            --current allocation-report.json \
            --output allocation-summary.md
          cat allocation-summary.md >> $GITHUB_STEP_SUMMARY

      - name: Upload allocation report
        if: matrix.unityVersion == needs.detect-versions.outputs.latest && hashFiles('allocation-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: allocation-report
          path: |
            allocation-report.json
            allocation-summary.md

      - name: Comment allocation report
        if: >-
          github.event_name == 'pull_request' &&
          matrix.unityVersion == needs.detect-versions.outputs.latest &&
          hashFiles('allocation-summary.md') != ''
        uses: peter-evans/create-or-update-comment@v4
        continue-on-error: true
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-path: allocation-summary.md
          # One comment per PR, rewritten in place, rather than a new one per push.
          edit-mode: replace
          comment-id: ${{ steps.find-comment.outputs.comment-id }}

      - name: Extract Unity major version
        id: unity-version
        run: echo "major=$(echo '${{ matrix.unityVersion }}' | grep -oE '^[0-9]+\.[0-9]+')" >> $GITHUB_OUTPUT

      - name: Upload Coverage to Codecov
        if: steps.changes.outputs.code == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: codecov/codecov-action@v5
        with:
          name: Unity ${{ matrix.unityVersion }} - playmode
          flags: unity-${{ steps.unity-version.outputs.major }}
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.tests.outputs.coveragePath }}/**/*.xml

      - name: Create issue on scheduled test failure
        uses: jayqi/failed-build-issue-action@v1
        if: failure() && github.event_name == 'schedule'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          title-template: "Scheduled test failed for Unity ${{ matrix.unityVersion }}"
          label-name: test-failure
