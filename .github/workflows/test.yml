name: 🧪 Tests
on:
  # Keep these two lists in sync. GitHub Actions does not support YAML anchors.
  push:
    branches:
      - main
      # The long-lived v5 branch. The stack of v5 PRs targets it rather than main,
      # so without this entry none of that work would be tested until the final merge.
      - 'feat/v5'
    paths:
      # The Unity project: the package under test, the manifests that resolve its
      # dependencies, the vendored packages it compiles alongside, the Addressables
      # setup the tests run against, and the editor version the project opens with.
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      # The workflow that decides what gets tested and how; the shared steps live
      # in mygamedevtools/unity-package-ci.
      - '.github/workflows/test.yml'
      # Docs never change behaviour, including docs shipped inside a package.
      - '!**.md'
  pull_request:
    branches:
      - main
      - 'feat/v5'
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/test.yml'
      - '!**.md'
  schedule:
    # Run on the 1st of every month at 2 AM UTC
    - cron: '0 2 1 * *'
  workflow_dispatch:

jobs:
  test:
    name: Tests
    uses: mygamedevtools/unity-package-ci/.github/workflows/test.yml@v1
    with:
      coverage-assemblies: '+MyGameDevTools.SceneLoading'
      test-mode: playmode
    secrets: inherit
