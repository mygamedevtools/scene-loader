name: 🧪 Tests
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
  schedule:
    # Run on the 1st of every month at 2 AM UTC
    - cron: '0 2 1 * *'
  workflow_dispatch:

jobs:
  detect-versions:
    name: Detect Unity Versions
    uses: ./.github/workflows/detect-unity-versions.yml
    with:
      version-streams: "6.0,6.3"

  test:
    name: Unity ${{ matrix.unityVersion }} - playmode
    runs-on: ubuntu-latest
    needs: detect-versions
    strategy:
      fail-fast: false
      matrix:
        unityVersion: ${{ fromJSON(needs.detect-versions.outputs.versions) }}
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Check for code changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            code:
              - '**.cs'

      - uses: actions/cache@v5
        with:
          path: Library
          key: Library-${{ matrix.unityVersion }}-playmode
          restore-keys: |
            Library-${{ matrix.unityVersion }}-

      - name: Use Unity 6.0 compatible packages
        if: startsWith(matrix.unityVersion, '6000.0')
        run: cp Packages/manifest.6.0.json Packages/manifest.json

      - name: Use Unity 6.3 compatible packages
        if: startsWith(matrix.unityVersion, '6000.3')
        run: cp Packages/manifest.6.3.json Packages/manifest.json

      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ./
          unityVersion: ${{ matrix.unityVersion }}
          testMode: playmode
          artifactsPath: playmode-artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity ${{ matrix.unityVersion }} playmode Test Results
          coverageOptions: 'generateAdditionalMetrics;assemblyFilters:+MyGameDevTools.SceneLoading'

      - name: Extract Unity major version
        id: unity-version
        run: echo "major=$(echo '${{ matrix.unityVersion }}' | grep -oE '^[0-9]+\.[0-9]+')" >> $GITHUB_OUTPUT

      - name: Upload Coverage to Codecov
        if: steps.changes.outputs.code == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: codecov/codecov-action@v5
        with:
          name: Unity ${{ matrix.unityVersion }} - playmode
          flags: unity-${{ steps.unity-version.outputs.major }}
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.tests.outputs.coveragePath }}/**/*.xml

      - name: Create issue on scheduled test failure
        uses: jayqi/failed-build-issue-action@v1
        if: failure() && github.event_name == 'schedule'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          title-template: "Scheduled test failed for Unity ${{ matrix.unityVersion }}"
          label-name: test-failure
