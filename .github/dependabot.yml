version: 2

# The documentation site lives on the `docs` branch, but Dependabot only reads
# this file from the default branch — hence the `target-branch` on every entry.
# Nothing here touches the Unity package on `main`.
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: docs
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    labels:
      - dependencies
      - documentation
    groups:
      # Docusaurus is a monorepo: bumping core without the preset and themes
      # breaks the build, so they have to move together.
      docusaurus:
        patterns:
          - '@docusaurus/*'
      react:
        patterns:
          - react
          - react-dom
          - '@mdx-js/*'

  - package-ecosystem: github-actions
    directory: /
    target-branch: docs
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - documentation
    groups:
      actions:
        patterns:
          - '*'
