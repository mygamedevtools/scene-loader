<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Cover</title>
<link rel="stylesheet" href="slides.css">
<style>
  /* Unity: the cover may show only the title, the publisher's logo or name, and a tagline. */
  html, body { width: 975px; height: 650px; }
  /* Level2 sits under the title and Level1 takes the right. */
  .cover-split .right { clip-path: polygon(70% 0, 100% 0, 100% 100%, 50% 100%); }
  .cover-split .seam { clip-path: polygon(69.9% 0, 70.1% 0, 50.1% 100%, 49.9% 100%); }
  .veil { background: linear-gradient(to top right, rgba(22,22,29,0.9) 0%, rgba(22,22,29,0.6) 40%, rgba(22,22,29,0) 70%); }
  .stripes { --stripes-height: 46%; }
  .content { padding: 56px 64px; justify-content: flex-end; }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: auto; }
  .brand img { width: 40px; height: 40px; }
  .brand .label { font-size: 14px; color: var(--mgt-palette-cream); }
  h1 { font-size: 84px; margin: 0; max-width: 560px; line-height: 0.98; }
  .tagline { margin-top: 18px; font-size: 24px; color: var(--mgt-palette-dust); }
</style></head>
<body>
  <div class="scenes cover-split"><img src="img/level2.jpg" alt=""><img class="right" src="img/level1.jpg" alt=""><div class="seam"></div></div>
  <div class="veil"></div>
  <svg class="stripes" viewBox="0 0 300 200" aria-hidden="true"><line x1="152" y1="-20" x2="320" y2="148" style="stroke: var(--mgt-color-stripe-1)" stroke-width="16"/><line x1="176" y1="-20" x2="320" y2="124" style="stroke: var(--mgt-color-stripe-2)" stroke-width="16"/><line x1="200" y1="-20" x2="320" y2="100" style="stroke: var(--mgt-color-stripe-3)" stroke-width="16"/></svg>
  <div class="content">
    <div class="brand"><img src="/assets/logo/svg/mark-dark.svg" alt=""><span class="label">My Gamedev Tools</span></div>
    <h1>My Scene Manager</h1>
    <p class="tagline">Scene transitions, in one line.</p>
  </div>
</body></html>
