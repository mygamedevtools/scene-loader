<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>A transition, mid-flight</title>
<link rel="stylesheet" href="slides.css">
<style>
  .veil { background: linear-gradient(to bottom, rgba(22,22,29,0.88) 0%, rgba(22,22,29,0.55) 28%, rgba(22,22,29,0.2) 42%, rgba(22,22,29,0.25) 60%, rgba(22,22,29,0.88) 100%); }
  .lede { margin-top: 12px; max-width: 640px; }
  .bottom { margin-top: auto; }
  .names { display: flex; justify-content: space-between; margin-bottom: 16px; }
  .op { padding: 20px 24px 22px; }
  .op .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .op .code { font-size: 18px; }
  .pct { font-family: var(--mgt-font-family-display); font-size: 22px; }
  .chips { display: flex; gap: 7px; margin-bottom: 16px; }
</style></head>
<body>
  <div class="scenes"><img src="img/level1.jpg" alt=""><img class="right" src="img/level2.jpg" alt=""><div class="seam"></div></div>
  <div class="veil"></div>
  <svg class="stripes" viewBox="0 0 300 200" aria-hidden="true"><line x1="152" y1="-20" x2="320" y2="148" style="stroke: var(--mgt-color-stripe-1)" stroke-width="16"/><line x1="176" y1="-20" x2="320" y2="124" style="stroke: var(--mgt-color-stripe-2)" stroke-width="16"/><line x1="200" y1="-20" x2="320" y2="100" style="stroke: var(--mgt-color-stripe-3)" stroke-width="16"/></svg>
  <div class="content">
    <div class="eyebrow"><i></i><i></i><i></i><span class="label accent">My Scene Manager</span></div><h1>A transition, mid-flight</h1>
    <p class="lede">Two scenes, and the operation reporting itself while it runs.</p>
    <div class="bottom">
      <div class="names"><span class="tag">Level1.unity</span><span class="tag">Level2.unity</span></div>
      <div class="panel op">
        <div class="row"><span class="code"><span class="type">MySceneManager</span>.TransitionAsync(<span class="str">"Level2"</span>, <span class="str">"Loading"</span>);</span><span class="pct">90%</span></div>
        <div class="chips"><span class="chip done">Resolving</span><span class="chip done">ScreenIn</span><span class="chip done">Unloading</span><span class="chip current">Loading</span><span class="chip">Activating</span><span class="chip">ScreenOut</span><span class="chip">Completed</span></div>
        <div class="bar"><i style="width: 90%"></i></div>
      </div>
    </div>
  </div>
</body></html>
